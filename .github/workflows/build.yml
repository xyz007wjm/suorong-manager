name: 编译Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install flask xlrd pyinstaller

      - name: 打包EXE
        shell: cmd
        run: pyinstaller --clean --onefile --name "缩绒客户管理系统" --add-data "templates;templates" --hidden-import flask --hidden-import xlrd --hidden-import sqlite3 --hidden-import datetime --hidden-import csv --hidden-import io --hidden-import webbrowser --hidden-import threading run.py

      - name: 上传EXE文件
        uses: actions/upload-artifact@v4
        with:
          name: 缩绒客户管理系统-Windows
          path: dist/缩绒客户管理系统.exe
