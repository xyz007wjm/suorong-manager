{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h4 class="mb-1"><i class="bi bi-pencil-square"></i> 编辑记录</h4>
    <p class="text-muted mb-0">修改缩绒日报记录 #{{ record.id }}</p>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">日期 <span class="text-danger">*</span></label>
                    <input type="date" name="date" class="form-control" required value="{{ record.date }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">客户名称 <span class="text-danger">*</span></label>
                    <input type="text" name="customer" class="form-control" required value="{{ record.customer }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">份量/品名</label>
                    <input type="text" name="product" class="form-control" value="{{ record.product }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">数量</label>
                    <input type="number" name="quantity" class="form-control" step="0.01" min="0" value="{{ record.quantity }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">单价</label>
                    <input type="number" name="unit_price" class="form-control" step="0.01" min="0" value="{{ record.unit_price }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">应收款</label>
                    <input type="number" name="receivable" class="form-control" step="0.01" min="0" value="{{ record.receivable }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">已收款</label>
                    <input type="number" name="received" class="form-control" step="0.01" min="0" value="{{ record.received }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">损益金额</label>
                    <input type="number" name="profit_loss" class="form-control" step="0.01" value="{{ record.profit_loss }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">运输人</label>
                    <input type="text" name="transporter" class="form-control" value="{{ record.transporter }}">
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> 更新
                </button>
                <a href="{{ url_for('records') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
