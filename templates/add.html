{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h4 class="mb-1"><i class="bi bi-plus-circle"></i> 新增记录</h4>
    <p class="text-muted mb-0">添加缩绒日报记录</p>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">日期 <span class="text-danger">*</span></label>
                    <input type="date" name="date" class="form-control" required value="{{ today }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">客户名称 <span class="text-danger">*</span></label>
                    <input type="text" name="customer" class="form-control" required placeholder="请输入客户名称" list="customerList">
                    <datalist id="customerList">
                        {% for c in customers %}
                        <option value="{{ c }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div class="col-md-4">
                    <label class="form-label">份量/品名</label>
                    <input type="text" name="product" class="form-control" placeholder="如: 0.3女衫">
                </div>
                <div class="col-md-3">
                    <label class="form-label">数量</label>
                    <input type="number" name="quantity" class="form-control" step="0.01" min="0" placeholder="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">单价</label>
                    <input type="number" name="unit_price" class="form-control" step="0.01" min="0" placeholder="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">应收款</label>
                    <input type="number" name="receivable" class="form-control" step="0.01" min="0" placeholder="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">已收款</label>
                    <input type="number" name="received" class="form-control" step="0.01" min="0" placeholder="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">损益金额</label>
                    <input type="number" name="profit_loss" class="form-control" step="0.01" placeholder="0" value="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">运输人</label>
                    <input type="text" name="transporter" class="form-control" placeholder="运输人姓名" list="transporterList">
                    <datalist id="transporterList">
                        {% for t in transporters %}
                        <option value="{{ t }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> 保存
                </button>
                <a href="{{ url_for('records') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
