<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 缩绒客户管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .login-card h4 {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-card .sub {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-card .form-control {
            padding: 12px 16px;
            font-size: 15px;
            border-radius: 10px;
        }
        .login-card .btn {
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            font-weight: 500;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }
        .footer-text a {
            color: #6b7280;
            text-decoration: none;
        }
        .alert {
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h4><i class="bi bi-grid-3x3-gap-fill"></i> 缩绒管理</h4>
            <p class="sub">客户管理系统 v1.0</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-medium">登录密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required autofocus>
            </div>
            <button type="submit" class="btn btn-dark w-100">登 录</button>
        </form>

        <div class="footer-text">
            <a href="https://wangjinming.com" target="_blank">Jackwang</a> | 缩绒客服管理系统 v1.0
        </div>
    </div>

    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        setTimeout(function() {
            document.querySelectorAll('.alert').forEach(function(el) {
                var bsAlert = new bootstrap.Alert(el);
                bsAlert.close();
            });
        }, 3000);
    </script>
</body>
</html>
